      {
        "Name": "pve.require_shared_iso_for_ha",
        "Description": "When true, escalates the config-drive ISO migration-safety warning to a\nnon-retriable error that fails create_vm. The warning (and, when this is\ntrue, the error) fires whenever create_vm registers the VM under any\nHA-driven feature (placement.dlb, placement.pin_az_via_ha_rules, or\nplacement.anti_affinity.use_ha_rules) while pve.iso_storage resolves to\na storage pool that /storage does not report as shared. Default false:\nthe hazard is only logged (see docs/configdrive.md), never blocks\ncreate_vm.\n",
