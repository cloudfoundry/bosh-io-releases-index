      {
        "Name": "pve.destroy_unreferenced_disks",
        "Description": "When true, delete_vm passes DestroyUnreferencedDisks=true to PVE's\ndestroy call on every non-retain delete (the synchronous path, the\nfast path, and the fast-path straggler sweep). PVE's own semantics:\nfree every volume on the VM's storages that is (a) not referenced in\nthe destroyed VM's config and (b) has a VMID matching the VM being\ndestroyed -- a storage-wide scan by VMID, not scoped to this VM's\nconfig.\n\nDefault false. On storage dedicated to a single PVE cluster this is\nsafe and sweeps up orphaned own-VMID volumes (e.g. a disk left behind\nby an interrupted create) that the config-scoped guards never touch.\nIt is UNSAFE the moment pve.vm_storage/disk_storage/iso_storage is\nshared with a second, independent PVE cluster (a second BOSH-Proxmox\nAZ pointed at the same NFS/dir export): the destroyed VM's VMID band\ncan overlap the other cluster's VMID band, and this flag would then\nfree the OTHER cluster's live disks -- from this cluster's view they\nare unreferenced and VMID-matching, identical to a genuine orphan.\nNothing in the delete path can tell the two cases apart.\n\nEnable only when the configured storage pools are NOT shared with any\nother independent PVE cluster or non-CPI tooling allocating VMIDs in\nthe same range. On shared storage, leave this false and rely on\ndisjoint per-CPI VMID banding instead -- orphaned own-cluster volumes\nthen accumulate and are visible to scripts/disk-audit rather than\nbeing swept automatically.\n",
