        "Description": "Optional map of operator-named disk-type profiles. Each key is a profile\nname (e.g. \"ssd\", \"archive\") and each value is an object whose\ncloud_properties key holds default cloud_properties for that profile.\nA disk is associated with a profile by setting cloud_properties.disk_type\nto the profile name at deploy time. Disk-type profiles take precedence over\nvm_type profiles when both define the same attribute. When unset\n(default {}), no profiles are defined and no behavior change occurs.\n",
