      {
        "Name": "pve.parked_disk_vmid_range_start",
        "Description": "Inclusive lower bound of the VMID range reserved for parker VMs\n(bosh-parker-\u003cn\u003e). Each parker VM holds up to 31 parked disk volumes in\nscsi0-30 slots. The band resolves under every detached_disk_strategy, at\nthe job level and in every cpi-config entry alike: under \"parked\" (the\ndefault) it is where parker VMs are allocated, and under \"free\" it is\nread-only — it lets the CPI recognize disks parked earlier and unpark\nthem on their next attach_disk or delete_disk instead of refusing them.\nAn unset (0) bound resolves independently of the other, so a cpi-config\nentry may move one bound and leave the other at 0. The resolved partner\nis the built-in bound when that leaves a window no wider than\n90000-90999, and otherwise is derived from the bound that was set, at the\nsame width: a start of 50000 alone gives [50000,50999], not\n[50000,90999]. Both bounds unset resolves to 90000-90999. Move the band\nonly to a window whose parker VMs move with it: a parked disk on a VM\noutside the resolved band can no longer be unparked, and attach_disk and\ndelete_disk refuse it until the band covers that VM again.\n\nMust not overlap the VM range, the persistent-disk range, or the\nstemcell-template range under the parked strategy; under \"free\" nothing\nallocates a parker VMID, so an overlap there is accepted rather than\nrejected. The bands are checked against each other, never against VMIDs\nalready allocated.\n",
        "Default": 0,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.operation_timeout.create_sec",
        "Description": "Deadline in seconds for create_* methods. Zero (default) applies the\nbuilt-in 1800 s. Honored only when operation_timeout.enabled is true.\n",
        "Default": 0,
        "Example": null,
