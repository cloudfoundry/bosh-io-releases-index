        "Name": "pve.cluster_lock_timeout_sec",
        "Description": "Bounds how long the anti-affinity read-modify-write waits to acquire the\ncluster lock before returning a retriable error (the BOSH director then\nre-drives the operation). It also serves as the lock's TTL: a holder whose\nrecorded expiry has passed is treated as crashed and its lock is stolen.\nOnly meaningful when cluster_lock_mode is \"pool\"; 0 resolves to 60 seconds.\n",
        "Default": 0,
