      {
        "Name": "pve.placement.dlb.require_shared_storage",
        "Description": "When true (default), the CPI skips DLB/HA registration for VMs whose root\ndisk resides on local storage (dir, lvm, lvmthin, zfspool) that cannot be\nlive-migrated. Registering a non-shared VM as an HA resource would cause\nPVE to attempt live-migration during rebalance and fail. Set to false to\nregister regardless — not recommended unless all storage is shared. When\nthe storage type cannot be determined at create time, the CPI fails open\n(proceeds with registration) and logs a debug entry.\n",
