      {
        "Name": "pve.stemcell_template_vmid_range_start",
        "Description": "Starting VMID for template VM allocation. Template VMs are allocated in\n[stemcell_template_vmid_range_start, stemcell_template_vmid_range_end], a\ndedicated band above the persistent disk range. When unset (0), defaults\nto 30000. Must not overlap with vmid_range_start..vmid_range_end (VM range)\nor the persistent disk range 9000-29999.\n",
        "Default": 0,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.placement.pin_az_strict",
        "Description": "Controls the strictness of the rule created by pin_az_via_ha_rules. Default\ntrue: a strict rule is a hard AZ guarantee — HA will not relocate the VM off\nits AZ node set even if every AZ node is down (durability of locality over\navailability). Set false for a preferred pin that lets HA relocate off-AZ on\ntotal AZ failure. Ignored when pin_az_via_ha_rules is false.\n\nThis default is deliberate — BOSH AZ placement is a contract, not a hint —\nbut it carries two operational hazards on an AZ mapped to a single node:\n(1) if that node goes down, the VM cannot restart anywhere else, since HA\nhas no other in-AZ node to fail over to; (2) draining that node for\nmaintenance (reboot, upgrade) has nowhere legal to place the VM, which can\nwedge the maintenance operation. Both hazards disappear once the AZ maps to\ntwo or more nodes, since HA then has an in-AZ fallback target. Map every\nstrict AZ to \u003e= 2 nodes. create_vm logs a Warn at pin time whenever a\nstrict pin targets a single-node AZ, naming the AZ and node, so this\ncondition is visible rather than silent.\n",
        "Default": true,
        "Example": null,
        "Examples": null
