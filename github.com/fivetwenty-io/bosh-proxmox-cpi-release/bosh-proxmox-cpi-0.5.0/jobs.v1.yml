        "Description": "Base URL of the OTLP collector endpoint (host:port or full URL) used\nfor traces. Required when pve.otel.enabled is true. Also serves as the\nfallback endpoint for the logs and metrics signals when their own\nendpoint properties are left empty.\n",
        "Default": "",
