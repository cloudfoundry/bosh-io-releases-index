      {
        "Name": "pve.disk_performance.aio",
        "Description": "Default PVE AsyncIO backend applied to every disk created by this CPI.\nValid values: native, io_uring, threads. Overridden per disk by\ncloud_properties.aio. When unset (default), the key is omitted and PVE\nuses its own default (io_uring on modern PVE hosts).\n\nio_uring is PVE's modern default and generally the best choice on a\ncurrent kernel. native (Linux AIO, kernel io_submit) pairs with\ncache=none on block-backed storage (lvmthin, zfspool, rbd, lvm) for the\nlowest-overhead path to raw/thin-provisioned block devices — the classic\n\"aio=native + cache=none\" combination for high-IOPS workloads on\nblock-native pools. threads uses a userspace thread pool and is the\nsafest fallback for file-backed storage (dir, nfs, cifs) or older\nkernels where io_uring is unavailable or unstable.\n\nStructural option: baked into the disk's PVE volid options at create\ntime (create_disk, create_vm's root disk) and governed by\ndisk_perf_invariant_mode on re-attach, same as cache/iothread/ssd — a\ndisk whose creation-time record diverges from a later re-resolution is\ncaught by that guard (reject in enforce mode, warn in warn mode, ignore\nin off mode).\n",
