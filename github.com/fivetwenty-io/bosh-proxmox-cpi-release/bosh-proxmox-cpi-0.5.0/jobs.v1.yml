      {
        "Name": "pve.detached_disk_strategy",
        "Description": "Lifecycle strategy for persistent disks in the detached state (between\ndetach_disk and the next attach_disk or delete_disk). One of:\n  \"\"       — same as \"parked\" (the default).\n  \"parked\" — detached disks are attached to a dedicated parker VM\n             (bosh-parker-\u003cn\u003e) in an active scsi slot (scsi0-30) with\n             protection=1 and onboot=0. The parker VM is never started.\n             Provides PVE-side ownership visibility and accident protection.\n             The CPI defaults pve.parked_disk_vmid_range_start and\n             pve.parked_disk_vmid_range_end to 90000/90999 if unset, each\n             bound independently. The parker VMID band must not overlap\n             the VM range, the persistent-disk range, or the\n             stemcell-template range. A deployment that asks for parking\n             by name, or that names its own parker band, fails to load on\n             overlap. A deployment that sets neither and whose other bands\n             reach into 90000-90999 keeps the pre-parking behavior for new\n             detaches on that load and warns (the band stays in force\n             read-only, so disks parked earlier still drain), so an\n             upgrade cannot take a working deployment down: set a free\n             parker band to turn parking on there. Costs a few extra PVE API calls per detach and attach.\n  \"free\"   — opt out of parking: detached disks float as unattached volumes\n             in their synthetic VMID container. PVE has no first-class\n             volume object; the disk is visible only via its container VM\n             config. Risk: administrators may mistake the container VM for\n             an unused resource and delete it, destroying the disk with it.\n             This was the default before parking became the default.\n             The parker band still resolves (90000/90999 unless set), so\n             a disk parked while \"parked\" was in effect is recognized and\n             unparked on its next attach_disk or delete_disk — switching\n             to \"free\" only stops NEW detaches from parking. delete_vm\n             and snapshot_disk still refuse a parker VM by tag.\n",
