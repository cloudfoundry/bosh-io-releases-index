      {
        "Name": "pve.ca_cert",
        "Description": "Optional. PEM-encoded CA certificate bundle for verifying the Proxmox VE\nAPI TLS certificate. When empty (default), the system trust pool is used\nunmodified — behavior is byte-identical to prior releases. When set, the\nPEM is parsed and the resulting cert pool replaces the system pool for PVE\nAPI HTTPS verification. Ignored when verify_ssl is false.\n",
        "Default": "",
        "Example": null,
        "Examples": null
