        "Name": "pve.placement.anti_affinity.use_ha_rules",
        "Description": "When true (and anti_affinity.enabled is also true), the CPI additionally\nregisters each VM as a PVE HA resource and maintains a cluster-level\nnegative resource-affinity rule (POST /cluster/ha/rules,\ntype=resource-affinity, affinity=negative) keyed on the BOSH instance\ngroup, so PVE enforces spreading at the hypervisor level rather than only\nat create time. On delete the VM is removed from the rule and empty rules\nare pruned. HA-managed resources interact with the BOSH resurrector;\nenable only when PVE-level enforcement is desired. Has no effect unless\nanti_affinity.enabled is true. Default false.\n",
