      {
        "Name": "pve.operation_timeout.enabled",
        "Description": "Opt-in per-method deadline envelope. When false (default) no deadline\nwraps handler execution and behavior is identical to prior releases. When\ntrue, each CPI method runs under a context deadline sized by its class so a\nwedged retry/poll combination converts into a retriable timeout the\nDirector can act on instead of holding a queue slot indefinitely.\n",
