      {
        "Name": "pve.resize_wait_for_convergence",
        "Description": "When true, resize_disk polls the VM config after the PVE resize task\ncompletes until the reported disk size reaches the requested size, before\nreturning. On asynchronous backends (Ceph RBD, LVM-thin) the size metadata\ncan lag the task completion, so a follow-on operation might otherwise read\nthe old size. The poll is best-effort: if the size has not converged within\nresize_convergence_timeout_sec it logs a warning and returns success, never\nblocking the director. Default false (no extra polling).\n",
        "Default": false,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.placement.pin_az_via_ha_rules",
        "Description": "When true and placement.az_map is set, create_vm writes a PVE HA\nnode-affinity rule binding each VM to its AZ's node set after scoring, so\nthe AZ placement is durable across HA failover and DLB rebalance (scoring\nalone only pins the VM at creation). delete_vm removes the rule. Best-effort\nand non-fatal. Incompatible with the DLB sentinel AZ (rejected at config\nvalidation, since DLB intentionally un-pins guests). Default false (opt-in).\n",
        "Default": false,
        "Example": null,
        "Examples": null
      },
