      {
        "Name": "pve.stemcell_fetch_tls_handshake_timeout_sec",
        "Description": "Optional. Bounds the TLS handshake step of every stemcell-fetch HTTPS\nrequest. 0 (default) applies the built-in 15s default. Valid range when\nset: 1-3600 seconds.\n",
