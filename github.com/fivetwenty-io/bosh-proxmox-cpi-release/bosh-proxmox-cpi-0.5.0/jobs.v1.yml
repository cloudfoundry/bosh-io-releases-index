        "Description": "Default read throughput cap in MB/s for every disk created by this CPI.\nZero or unset means no cap. Fractional values are accepted (e.g. 100.5).\nOverridden per disk by cloud_properties.mbps_rd. When unset (default), the\nkey is omitted and PVE imposes no throughput limit.\n",
