      {
        "Name": "pve.placement.reserve_storage_headroom",
        "Description": "Enables the storage-capacity hard placement filter. When true, create_vm\ncomputes a minimum free-storage requirement for each candidate node and\nrejects nodes whose target storage pool does not have enough free bytes to\nhold the VM's disks plus a headroom margin. The filter is fail-open: nodes\nwhose storage facts are unavailable (ListStorage API error or no matching\npool) are never rejected — they pass and may be picked by the scorer.\nThe filter is applied only to the VM storage pool (pve.vm_storage); disks\nthat resolve to a different pool (e.g. a separately configured ephemeral\npool) are excluded from the count. A capacity shortfall is treated as a\npermanent, non-retriable placement failure. Default false (opt-in);\nplacement is byte-identical to prior releases when unset or false.\n",
