        "Description": "List of PVE node tags that mark a node as in maintenance. A node carrying any\ntag in this list is excluded from placement when placement.exclude_maintenance_nodes\nis true (or defaults true). Default [\"maintenance\"]. Set to [] to disable tag-based\ndetection while still honoring HA-status-based detection. Leave unset to accept\nthe default.\n",
        "Default": [],
