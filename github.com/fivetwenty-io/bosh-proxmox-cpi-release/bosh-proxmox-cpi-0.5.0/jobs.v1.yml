      {
        "Name": "pve.ephemeral_disk_min_ratio",
        "Description": "Minimum size floor, as a multiple of VM RAM, for a dedicated ephemeral disk\ncreated by create_vm (when ephemeral_disk_size_mb is set). The BOSH agent\nlays a RAM-sized swap file plus /var/vcap/data on the ephemeral disk, so an\nephemeral disk smaller than ratio × RAM cannot satisfy the agent's own\nlayout and the job fails to come up at boot. When set, create_vm asserts\nephemeral_GiB \u003e= ratio × (RAM_MiB / 1024) and, on violation, rejects (or\nwarns — see ephemeral_disk_min_mode). 0 (the default) disables the check\nentirely, leaving create_vm byte-identical to prior releases. The check is\nalso skipped when no dedicated ephemeral disk is requested (the agent then\ncarves ephemeral storage from the grown root disk). A conventional value is\n2.\n",
