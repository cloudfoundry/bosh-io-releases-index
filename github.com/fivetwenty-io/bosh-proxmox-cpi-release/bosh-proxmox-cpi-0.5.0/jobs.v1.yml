      {
        "Name": "pve.operator_id",
        "Description": "Optional operator identifier appended to the User-Agent header on all PVE\nAPI requests as \"pid-\u003cvalue\u003e\". Use this to attribute CPI traffic in PVE\naccess logs when multiple BOSH directors share a single PVE cluster.\nWhen unset (the default), the User-Agent is \"BOSH-Proxmox-CPI/\u003cversion\u003e\"\nwith no suffix. The value passes through unmodified; avoid whitespace and\ncontrol characters, which may be interpreted differently by PVE log parsers.\n",
        "Default": null,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.sdn_vni_range_start",
        "Description": "Start of the band from which the CPI auto-allocates vnet tags (VNIs\nfor vxlan/evpn, 802.1Q VLAN IDs for vlan/qinq) for tagged zone\ntypes. 0 uses the default band: 5000-5999, or 2000-2999 when\nsdn_zone_type is vlan or qinq (the band must fit the 4094 VLAN ID\ncap; an explicit band beyond it fails validation). Per-network\noverride via cloud_properties.vnet_tag.\n",
