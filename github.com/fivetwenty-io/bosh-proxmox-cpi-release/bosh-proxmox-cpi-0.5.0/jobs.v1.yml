      {
        "Name": "pve.placement.exclude_maintenance_nodes",
        "Description": "When true (default), nodes in a PVE HA maintenance or error state, or carrying\nany tag listed in placement.maintenance_node_tags, are excluded from placement\ncandidates at create_vm time. Set to false only when HA status is unavailable\nor placing on maintenance nodes is intentional. The Go accessor defaults nil to\ntrue — leave this property unset to accept the default.\n",
