      {
        "Name": "pve.fast_path_delete",
        "Description": "When true, delete_vm and delete_disk issue the PVE destroy call and return\nimmediately without awaiting the task's terminal state. delete_vm additionally\nstamps a \"bosh-deleting\" tag on the VM before issuing the destroy; each\nsubsequent fast-path delete_vm sweeps the cluster for VMs still carrying that\ntag and re-issues the destroy, so a stalled async destroy is reaped automatically.\nDisk volumes cannot carry PVE tags, so no marker is applied there.\nThis eliminates the queue-slot hazard of a hung destroy-task poll at the\ncost of eventual consistency: a subsequent has_vm or has_disk call may\nbriefly still see the resource until PVE's async destroy completes.\nDefault false (synchronous, fully-consistent behavior unchanged).\n\nThe fast-path destroy issues DeleteQemu with skiplock=true so a locked\nor still-running VM is destroyed without a separate unlock/stop step\nfirst. PVE honors skiplock=true only for the literal root@pam\nsuperuser (password auth) — not for any API token, including one\nowned by root@pam, and not for any other authenticated identity\nregardless of granted privileges or role. Enabling fast_path_delete\nunder any other identity means the skiplock destroy call falls back to\nPVE's own rejection whenever it actually hits a locked or running VM;\nthe CPI logs a startup Warn naming the configured identity when this\ncombination is detected, but does not block config load over it — the\noperator may know the identity ultimately resolves to root@pam\nthrough a proxy layer this check cannot see.\n",
        "Default": null,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.user",
        "Description": "PVE username",
        "Default": null,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.node_endpoints",
        "Description": "Optional map of PVE node name to the address (host or host:port, no\nscheme, no path) that node's own pveproxy is reachable at. Storage\nuploads targeting a mapped node (stemcell images, per-VM ConfigDrive\nISOs) dial it directly instead of letting the pve.host endpoint proxy\nthe multipart POST cross-node, a hop that sheds connections under\nburst load. Nodes absent from the map are discovered from\n/cluster/status when pve.node_endpoints_discovery allows it (default:\nonly when verify_ssl is false); with verify_ssl true we only route\nnodes listed here, because the discovered address is the corosync\nlink0 IP and stock PVE node certificates usually do not carry it as a\nSAN. Prefer hostnames or FQDNs the node certificate covers. When a\ndirect dial fails TLS certificate verification, a TLS handshake\nfailure for any other reason, or the connection itself (unresolvable,\nrefused, unreachable, reset or stalled during the handshake), the\nupload falls back to the pve.host endpoint, logs a warning, and skips\nthat node's direct route for the rest of the process.\nExample: {pve02: pve02.example.com, pve03: 10.0.0.13:8006}\n",
        "Default": {},
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.stemcell_template_vmid_range_end",
        "Description": "Inclusive upper bound of the VMID range for template VM allocation.\nWhen unset (0), defaults to 30999. Must be \u003e stemcell_template_vmid_range_start.\nMust not overlap the persistent disk range 9000-29999.\n",
        "Default": 0,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.stemcell_fetch_block_private_networks",
        "Description": "Optional. When true, the https and bosh+blobstore stemcell fetchers\nrefuse any connection whose target resolves to a private, loopback, or\nlink-local address. The check runs on every dial, so redirect hops and\nDNS-rebinding flips are covered. Leave false (the default) when\nimage_url points at a mirror on a private network — that is a\nlegitimate deployment shape; enable when the mirror is public and a\nredirect chain must never re-enter the private network.\n",
        "Default": false,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.placement.az_map",
        "Description": "Optional. Maps availability-zone names to the PVE node names that\nserve each AZ. When a VM is created with cloud_properties.availability_zone\nset to a key in this map, candidate nodes are restricted to the mapped\nlist and the scorer picks the best-fit node within that set.\nIf availability_zone is set in cloud_properties but the value is not\npresent in this map, create_vm returns an error (explicit\nmisconfiguration, not silent fall-through). When empty (default), all\nonline cluster nodes are candidates regardless of availability_zone.\nExample: {us-east-1a: [pve01, pve02], us-east-1b: [pve03]}\n",
        "Default": {},
