      {
        "Name": "pve.vm_pool_template",
        "Description": "Director-level pool-name template rendered at create_vm time when\nneither the call-level nor the vm_type-level cloud_properties.pool\nis set (precedence position 3, above the pve.vm_pool global default;\nsee pve.vm_pool for the full pipeline). Supports four variables:\n\"{prefix}\" (pve.vm_prefix), \"{director}\", \"{deployment}\", and\n\"{instance_group}\"; any other \"{...}\" token is rejected at config\nload. The rendered name is sanitized (repeated separators collapsed to\none, leading/trailing \"-\" trimmed); a render that collapses to \"\"\nfalls through to pve.vm_pool. Must not contain \"/\" (flat names only,\nthe CPI never creates nested pools); the same PVE poolid charset rules\nthat apply to vm_pool also apply to the rendered result, and a render\nthat equals pve.stemcell_template_pool fails create_vm with a named\nerror. The default \"bosh-{director}-{deployment}\" gives every\ndeployment its own pool; set explicitly to \"\" to disable this layer\nentirely, so resolution falls straight from call/vm_type to\npve.vm_pool (the single static pool, and the right choice on clusters\nwhose CPI token cannot create pools).\n\nOn a create-env path (bosh create-env, no director VM yet) the\n{director} token is underivable and {deployment} falls back to\npve.create_env_deployment, so this default renders \"bosh-create-env\",\nshared by every create-env director on the cluster unless\npve.create_env_deployment is set per bundle.\n",
        "Default": "bosh-{director}-{deployment}",
