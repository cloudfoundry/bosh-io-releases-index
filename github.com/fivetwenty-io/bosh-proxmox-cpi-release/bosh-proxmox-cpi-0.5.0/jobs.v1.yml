        "Description": "Extra storage margin in MiB added on top of the VM's raw disk footprint when\nplacement.reserve_storage_headroom is true. Mirrors vSphere's DISK_HEADROOM\nconstant: an absolute safety buffer so the placement filter accounts for\nfilesystem overhead and thin-provisioning slack. When 0 (default), a 1 GiB\nfloor is used. Negative values are rejected at startup. Only meaningful when\nplacement.reserve_storage_headroom is true.\n",
