      {
        "Name": "pve.storage.max_utilization_pct",
        "Description": "Ceiling on projected storage-pool utilization, as a percentage of pool\ncapacity (0-100). Default 0 (disabled): behavior is byte-identical to\nprior releases. When set \u003e 0, four evaluation points check the target\npool's utilization AFTER accounting for the operation's disk footprint:\n  - create_vm placement: a candidate node whose vm_storage pool would\n    exceed the ceiling after adding the VM's disk footprint is rejected\n    from placement (enforce mode) or logged (warn mode).\n  - create_disk: the resolved disk pool is checked before allocation.\n  - resize_disk: the resize delta is checked before the resize call.\n  - snapshot_disk: Warn-only regardless of storage.max_utilization_mode\n    — snapshot growth is unbounded and cannot be estimated ahead of\n    time, so this evaluation point only warns when the pool is already\n    above the ceiling; it never blocks a snapshot.\nComputation reuses the storage status the CPI already fetches (used/total\nbytes from the node storage API); when storage facts cannot be determined\n(API error, pool not found, or pool inactive) the gate fails open\n(proceeds) and logs a warning, matching placement.reserve_storage_headroom's\nfail-open behavior. This gate is independent of, and composes with,\nplacement.reserve_storage_headroom: the pct ceiling is a proportional\nearly-warning band, the headroom filter is a fixed-byte-margin floor;\nboth can be active together.\n\nWhy this matters: copy-on-write pools (qcow2, thin-LVM, ZFS) degrade\nprogressively as they fill — noticeably from roughly 50% utilization,\nbadly by roughly 80%, and a pool that fills completely can take days to\nrecover. Ceph separately enforces nearfull/backfill-full/full watermarks\nat 85/90/95% by default; a ceiling set below those watermarks gives an\nearlier, CPI-level signal before Ceph's own thresholds engage, which\nmatters most on small clusters where Ceph's default watermarks leave\nlittle headroom above them — a strict