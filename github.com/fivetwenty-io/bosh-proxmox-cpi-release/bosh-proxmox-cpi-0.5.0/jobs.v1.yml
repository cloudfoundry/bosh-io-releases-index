        "Description": "When true (default), create_vm runs live node-scoring to select the\nbest-fit PVE node based on available memory, CPU headroom, storage\ncapacity, and guest density. When false, create_vm falls back to\npve.node (the existing static behavior). An explicit cloud_properties\ntarget_node always wins over scoring regardless of this setting.\nProtective default: true. Set to false to opt out of scoring and\npreserve legacy single-node behavior.\n",
