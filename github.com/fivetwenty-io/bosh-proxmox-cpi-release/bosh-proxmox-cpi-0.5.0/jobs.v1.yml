        "Description": "When true, the CPI emits OpenTelemetry traces for each RPC and the PVE\nAPI calls it makes, exported via OTLP (see pve.otel.protocol) to\npve.otel.exporter_endpoint. Default false; when false no tracer\nprovider is built, no network connection is opened, and PVE API calls\nbypass the tracing layer entirely.\n",
