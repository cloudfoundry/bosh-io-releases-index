        "Name": "pve.retry.disk_migrate.max_attempts",
        "Description": "Maximum attempts for transient retries of the cross-node disk-migration\nrequest attach_disk issues when pve.disk_migration resolves to\n\"on_attach\". Zero (default) applies the built-in budget of 4. The\nrequest runs while the mover's protection flag is down, so a long\nbudget widens that window.\n",
        "Default": 0,
        "Example": null,
        "Examples": null
