      {
        "Name": "pve.iso_storage_follow_vm_storage",
        "Description": "When true (the default), resolves the ConfigDrive ISO pool to\npve.vm_storage instead of the pve.iso_storage default, provided\nvm_storage advertises PVE content type `iso` and is shared. Evaluated\nonce at CPI process startup, before pve.iso_storage is otherwise\napplied. Because BOSH renders the \"local\" spec default for iso_storage\nwhether or not the operator set it in the manifest, the CPI cannot\ndistinguish \"unset\" from \"explicitly local\" — this flag therefore\ntreats iso_storage resolving to the literal value \"local\" as the\n\"unset\" signal. An operator who deliberately sets iso_storage: local\nwhile this flag is active (its default state) gets vm_storage-following\nbehavior instead of a literal local pool; set iso_storage to any other\nvalue to pin a literal pool this flag will never override. When\nvm_storage lacks `iso` content, is not shared, or cannot be resolved,\nthe CPI falls back to iso_storage unchanged and logs a warning\n(fail-open). Set explicitly to false to disable and always use\niso_storage as configured. Leave unset (~) to get\nthe default-true behavior; explicit true/false always overrides it.\n",
        "Default": null,
        "Example": null,
        "Examples": null
