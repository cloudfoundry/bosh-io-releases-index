      {
        "Name": "pve.replica_adopt_timeout_sec",
        "Description": "Adopt-and-wait bound (seconds) for a racing concurrent template-replica clone.\nWhen two CPI invocations independently decide a node needs a per-node stemcell\nreplica, both can pass the existence check while a winner is still building and\nthen clone, producing a duplicate half-built replica template. When \u003e 0, the\nreplica build first probes for an in-flight winner (a VM carrying the replica\ntags but not yet frozen / still clone-locked) and, finding one, waits up to this\nmany seconds for it to become a settled template and adopts it instead of\nbuilding a duplicate; a winner that never settles within the bound causes the\nnode to be skipped (best-effort, re-driven next deploy). Default 0 disables the\nadopt path, leaving replica-build behaviour byte-identical. A conventional value\nis 300. Operator note: if a winning clone crashed and left its guest stuck with\na \"clone\"/\"create\" config lock, every subsequent deploy will re-wait the full\ntimeout and skip that node (the warning names the stuck vmid and lock); clear it\nwith \"qm unlock \u003cvmid\u003e\" on the holding node so the replica can settle or rebuild.\n",
