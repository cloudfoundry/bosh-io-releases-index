        "Name": "pve.parked_disk_vmid_range_end",
        "Description": "Inclusive upper bound of the VMID range for parker VMs. Must be \u003e\nparked_disk_vmid_range_start. An unset (0) bound resolves to 90999\nindependently of the lower bound, under every strategy. Must not overlap\nthe VM range, the persistent-disk range, or the stemcell-template range\nunder the parked strategy; under \"free\" the overlap is accepted, since\nnothing allocates a parker VMID there.\n",
