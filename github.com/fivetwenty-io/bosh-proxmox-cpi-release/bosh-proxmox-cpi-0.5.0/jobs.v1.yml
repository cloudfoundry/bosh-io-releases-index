        "Name": "pve.cpu_type",
        "Description": "Emulated CPU type/model written to every new VM's PVE \"cpu\" config key\n(e.g. \"host\", \"x86-64-v2-AES\", \"Skylake-Server-noTSX-IBRS\"). Default\n\"\" (empty) resolves to \"host\": the guest sees the physical CPU's full\nfeature set, the best-performing choice, and safe on the homogeneous\nclusters typical of BOSH deployments. Set the sentinel \"pve-default\"\nto restore the legacy behavior: the CPI writes no cpu key at all and\nPVE falls back to kvm64.\n\nWARNING — heterogeneous clusters: a \"host\"-typed guest can crash when\nlive-migrated to a node with a different CPU generation. If your\ncluster mixes CPU models and relies on live migration (HA, DLB,\nmaintenance evacuations), override this with a portable named model.\n\"x86-64-v2-AES\" (PVE's own create-wizard default since 8.0) keeps\nAES-NI and live-migrates across CPU generations from roughly 2010\nonward; for hardware older than that baseline, use the cluster's\nlowest-common-denominator named model.\n\nPrecedence (highest wins): cloud_properties.cpu_type (per-instance-group,\nresolved through the same call/disk_type/vm_type layered resolver as\nother create_vm knobs; the \"pve-default\" sentinel works there too) \u003e\nthis global value \u003e built-in default \"host\".\ncloud_properties.pve_config.cpu is a separate raw escape hatch applied\nafter VM creation in the same create_vm call — when both this and\npve_config.cpu are set, pve_config.cpu wins as the final write (the\nCPI logs an Info line pointing at this knob when pve_config.cpu is\nused).\n\nExisting VMs keep their CPU type until recreated; a changed value (or\nthis release's new default) applies on the next VM creation, e.g.\n\"bosh deploy --recreate\". PVE validates the model name itself; the\nCPI passes the value through verbatim with no additional validation.\n",
