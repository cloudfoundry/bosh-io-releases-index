      {
        "Name": "pve.api_tls_handshake_timeout_sec",
        "Description": "Optional. Bounds the TLS handshake step of every PVE API HTTPS request.\n0 (default) leaves the transport at the SDK default (no explicit handshake\ntimeout). When set, the handshake is cancelled if it has not completed\nwithin this many seconds. Must be \u003e= 0.\n",
        "Default": 0,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.ip_conflict_probe",
        "Description": "Selects the active IP-conflict probe mode. When empty or \"off\" (default),\nno active probe runs and behavior is identical to prior releases.\nWhen \"agent\", create_vm additionally calls the QEMU guest agent on each\nrunning VM to collect dynamically assigned IP addresses and checks them\nagainst the target IPs before provisioning. This detects DHCP-assigned\naddresses that the static-config scan (ensure_no_ip_conflicts) cannot see.\nThe probe is fail-open: a guest agent error is logged and that guest is\nskipped, never blocking provisioning.\nValid values: \"\" (empty, same as \"off\"), \"off\", \"agent\".\nOnly meaningful when ensure_no_ip_conflicts is true or unset.\n",
        "Default": "",
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.placement.az_fallback_order",
        "Description": "Ordered list of AZ names appended as fallback candidates after\ncloud_properties.availability_zones are exhausted. Use to express a cluster-wide\n\"prefer AZ-a then AZ-b\" policy without per-VM cloud_properties. Empty (default)\nmeans no config-level fallback chain; placement considers only AZs from\ncloud_properties.\n",
        "Default": [],
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.ephemeral_disk_min_mode",
        "Description": "Action when the ephemeral_disk_min_ratio invariant is violated: \"enforce\"\n(the default) rejects create_vm with a non-retriable error naming the\ndeficit; \"warn\" logs the deficit and proceeds. No effect unless\nephemeral_disk_min_ratio is set. One of enforce|warn; empty resolves to\nenforce.\n",
        "Default": "",
        "Example": null,
        "Examples": null
