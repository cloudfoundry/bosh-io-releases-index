      },
      {
        "Name": "pve.disk_migration",
        "Description": "Cross-node persistent-disk migration on attach. One of:\n  \"\"          — same as \"on_attach\" (the default).\n  \"on_attach\" — when a stable-ID disk sits on one node and the target\n                VM runs on another, attach_disk moves the disk instead\n                of erroring: the disk is isolated onto a fresh\n                single-purpose mover parker VM on its own node (a\n                metadata-only reassignment, so sibling parked disks\n                never travel), the never-started mover is\n                offline-migrated to the VM's node through the PVE\n                migrate API (a metadata move on shared storage, a\n                volume copy on node-local storage), the disk attaches\n                from the mover, and the now-empty mover is destroyed\n                through a guard that refuses to destroy a mover still\n                referencing any volume.\n  \"off\"       — restore the hard cross-node errors; attach_disk names\n                this property in the refusal.\nLegacy disks (created before stable disk identities) are never migrated\nunder either setting: the migration renames the volume and a legacy CID\nis the volume name. Disks on an offline node cannot migrate either; PVE\nneeds the source node online to run the migration task. Overridable per\ncpi-config entry as pve_disk_migration.\n",
        "Default": "",
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.health_check.enabled",
        "Description": "When true, create_vm polls the guest QEMU agent via ping after the start task\ncompletes, waiting until the agent responds or the deadline (health_check.timeout_sec)\nexpires. On timeout, VM status diagnostics are folded into the error before the\nstandard rollback runs. Default false (opt-in): no polling occurs and create_vm\nreturns as soon as PVE reports the start task complete.\n",
        "Default": false,
        "Example": null,
        "Examples": null
