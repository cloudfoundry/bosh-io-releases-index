        "Name": "pve.disk_vmid_range_start",
        "Description": "Starting VMID for persistent-disk container allocation. Disk containers\nare allocated in [disk_vmid_range_start, disk_vmid_range_end]. When unset\n(0), defaults to 9000. Must not overlap the VM range or the template range.\n",
