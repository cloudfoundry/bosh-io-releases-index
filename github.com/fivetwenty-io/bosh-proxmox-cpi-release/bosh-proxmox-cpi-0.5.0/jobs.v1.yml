      {
        "Name": "pve.health_check.expected_agent_sha256",
        "Description": "Expected SHA-256 hex digest of the BOSH agent binary\n(/var/vcap/bosh/bin/bosh-agent) inside the booted VM. When non-empty and\nhealth_check.enabled is true, create_vm runs sha256sum via the QEMU guest\nagent after the ping succeeds and fails (destroying the VM) only on a\nconfirmed digest mismatch; any inability to verify (guest-agent error,\nnon-zero exit, unparseable output) is fail-open. Must be 64 hex characters\nwhen set. Empty (default) disables the assertion.\n",
        "Default": "",
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.pool_reap_empty",
        "Description": "When true, delete_vm deletes a CPI-managed pool (tagged with the\n\"managed by bosh-proxmox-cpi\" provenance comment) once the destroyed VM's\npool membership, captured before destroy, is reported empty by PVE.\nAn operator-created pool without that provenance comment is never\nreaped, the static pve.vm_pool and pve.stemcell_template_pool are\nrefused by name regardless of comment, and a pool that is still\nnon-empty or already gone (a race with another creator) is tolerated\nsilently, never failing delete_vm. Only the main delete_vm path\nreaps; the fast-path delete skips the reaper, so some empty pools\npersist until a later synchronous delete. Requires the CPI's PVE\ntoken to hold Pool.Allocate on the pool being reaped. Default true:\nthe per-deployment pools the pve.vm_pool_template default creates are\nreaped with their deployments. Set to false to keep empty pools for\nthe operator to manage.\n",
        "Default": true,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.iso_storage",
        "Description": "Storage pool (dir/nfs/cifs with `iso` content enabled) used to hold the\nper-VM ConfigDrive ISO. Block storages (lvm/lvmthin/zfspool) cannot\nhold ISO files. The ISO is attached as a CD-ROM on scsi30 for the VM's\nwhole life, not only at boot: PVE refuses to live-migrate a VM whose\nCD-ROM volume sits on non-shared storage, and HA recovery on another\nnode fails at start because the ISO file does not exist there. This\nsilently defeats placement.dlb, placement.pin_az_via_ha_rules, and\nplacement.anti_affinity.use_ha_rules. Use a shared pool (rbd, nfs, cifs,\nglusterfs, cephfs) whenever any of those features is active; see\npve.require_shared_iso_for_ha and pve.iso_storage_follow_vm_storage.\n",
        "Default": "local",
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.network_mode",
        "Description": "Selects the default create_network/delete_network path. The mode\ngoverns networks whose spec does not say otherwise; an unambiguous\nnetwork spec overrides it (cloud_properties naming a zone or vnet\ntakes the SDN path under \"bridge\"; naming only a bridge takes the\nbridge path under \"sdn\"). This setting has no effect on create_vm's\nNIC attachment: mtu=1 vnet-MTU inheritance and cloud_properties.vlan\ntagging are both decided by the actual SDN vnet list in every mode,\nnot by network_mode.\n\"bridge\" — Linux bridge lifecycle via the nodes API. The default:\n         a plain pre-existing Linux bridge (managed: false,\n         cloud_properties.bridge) needs no SDN prerequisites and no\n         CPI-side provisioning — the normal path for an\n         operator-managed fabric. create_network under this mode\n         provisions a bridge on one PVE node only (see\n         create_network's own single-node-scope note); multi-node\n         bridge fabrics must be pre-provisioned outside the CPI.\n\"sdn\" — PVE SDN vnet lifecycle (cluster SDN must be enabled).\n         CPI-created networks are SDN vnets that span every cluster\n         node. Opt in globally (network_mode: sdn) or per network via\n         cloud_properties naming a zone or vnet.\n\"auto\" — legacy heuristic retained for compatibility: use SDN when\n         cloud_properties.zone or pve.sdn_zone is set; fall back to\n         bridge otherwise. Deployments that relied on the old\n         auto-to-bridge fallback without naming a zone can also give\n         each bridge network an explicit cloud_properties.bridge and\n         keep the default mode.\n",
        "Default": "bridge",
        "Example": null,
        "Examples": null
