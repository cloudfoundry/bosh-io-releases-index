      {
        "Name": "pve.disk_performance.iothread",
        "Description": "When true, enables the PVE iothread option on every disk created by this\nCPI. One I/O thread per disk reduces contention on the QEMU main loop.\nApplicable to virtio-scsi-single and virtio-blk buses; ignored on ide/sata\nbuses by PVE. Overridden per disk by cloud_properties.iothread.\n\nDefault true: a dedicated I/O thread per disk relieves\nQEMU main-loop contention on multi-disk BOSH VMs and matches the modern\nPVE creation default; leaving iothread off serializes every disk's I/O\nbehind the shared main loop. Set false (globally or per disk via\ncloud_properties.iothread) to restore the earlier off-by-default behavior. This is\na create/attach-time bake only: existing VMs and previously baked disk\nCIDs are unaffected — the recorded structural options on an existing\ndisk CID are never silently rewritten to the new default; a disk whose\ncreation-time record diverges from the newly-resolved default at the\nnext attach is instead governed by disk_perf_invariant_mode (reject in\nenforce mode, warn in warn mode, ignore in off mode), same as any other\ndisk_performance configuration change. A deliberate per-disk change is\nstill available at any time through update_disk, which records the\nupdate so it survives detach/attach cycles.\n",
