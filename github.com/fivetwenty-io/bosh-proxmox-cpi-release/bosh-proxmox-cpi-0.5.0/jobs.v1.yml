        "Description": "When false (default) unknown configuration keys are logged as warnings and\na handful of contradictory option combinations are tolerated, preserving\nbehavior identical to prior releases. When true the CPI fails fast at\nstart-up, rejecting unknown top-level keys and these cross-field\ncontradictions: use_ha_rules without anti_affinity enabled; network_mode\nsdn without an sdn_zone or sdn_auto_manage_zone; and a DLB\nrequire_shared_storage setting while the dynamic load balancer is disabled.\n",
        "Default": false,
