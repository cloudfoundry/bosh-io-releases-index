        "Description": "Optional MTU override for CPI-created SDN zones. 0 (the default)\nlets PVE derive the vnet MTU from the underlay (e.g. 1450 on a 1500\nunderlay for vxlan). Set for unusual underlays (e.g. 8950 on a\n9000-MTU jumbo underlay).\n",
