      {
        "Name": "pve.balloon",
        "Description": "Memory-balloon setting written to every new VM's PVE \"balloon\" config\nkey. Default \"\" (empty) resolves to \"0\": the balloon device is\ndisabled. BOSH sizes VMs deterministically from the manifest and the\nagent plans job memory against that size, so PVE's default\nauto-ballooning — which reclaims guest memory beneath those\nassumptions — invites OOM kills that look like application failures.\n\nSet a positive integer (MiB) to enable PVE auto-ballooning with that\nfloor; the CPI fails fast when the value exceeds the VM's memory. Set\nthe sentinel \"pve-default\" to leave no balloon key on the VM — on\nclones the CPI clears the template-inherited value — restoring\nPVE's own default (device enabled, balloon = memory) for clusters\nthat deliberately overcommit memory.\n\nPrecedence (highest wins): cloud_properties.balloon\n(per-instance-group, resolved through the same call/disk_type/vm_type\nlayered resolver as other create_vm knobs; the \"pve-default\" sentinel\nworks there too) \u003e this global value \u003e built-in default \"0\".\ncloud_properties.pve_config.balloon is rejected — this knob is the\nsupported surface. Applies on VM creation; existing VMs keep their\nballoon setting until recreated.\n",
        "Default": "",
