      {
        "Name": "pve.parked_anchor_strict",
        "Description": "Anchor-missing invariant for the parked strategy. A disk created under\n\"parked\" carries a promise in its CID that a parker VM holds it whenever\nit is detached. When the cluster-wide holder scan then finds no holder\nat all, or a parker the scan identified vanishes before it can be read\nor unparked, the anchor is missing: a parker VM was deleted out-of-band.\nUnset or true (strict, the default): attach_disk, create_vm with\ndisk_cids, and delete_disk refuse with an error naming the recovery\ninstead of proceeding against a volume whose protected home silently\ndisappeared. Set false to restore the permissive behavior (the volume\nis treated as free-floating), for labs that intentionally delete parker\nVMs. Disks without the promise in their CID (created before this\nrelease, or under the \"free\" strategy) are always handled permissively;\ntheir anchor was never promised.\n",
        "Default": null,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.retry.transient.max_attempts",
        "Description": "Maximum attempts for transport-layer transient retries (pvedaemon\nworker recycling, connection refusals, request timeouts). Zero\n(default) applies the built-in budget of 8. The backoff curve for this\nclass is fixed (1s growing to 15s, plus/minus 30 percent jitter) and\nis not configurable.\n",
        "Default": 0,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.security_groups",
        "Description": "Optional global default list of PVE firewall group names applied to every\nVM that does not carry a per-call or per-profile security_groups override.\nEach entry must be a group name that already exists in the PVE firewall\nconfiguration. When empty (default []), no global firewall groups are\napplied and behavior is unchanged from prior releases. As with\npve.vm_firewall, the attached group rules are unenforced unless the PVE\ndatacenter firewall master switch (Datacenter \u003e Firewall \u003e Options \u003e\nEnable) is also on; create_vm warns once per process when it detects the\nswitch is off. See docs/configuration.md for the anti-lockout\nprerequisites before enabling the master switch.\n",
