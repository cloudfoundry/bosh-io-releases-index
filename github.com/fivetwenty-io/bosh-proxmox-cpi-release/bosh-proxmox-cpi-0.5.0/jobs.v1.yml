      {
        "Name": "pve.disk_performance.ssd",
        "Description": "Tri-state (true|false|unset, default unset = auto), same auto\nresolution as pve.disk_performance.discard — see that property for the\nfull TRIM-capability matrix and precedence rules. When true (explicit or\nauto-resolved), marks the disk as SSD-backed (rotation=0 in the guest).\nOverridden per disk by cloud_properties.ssd, which accepts the same\nthree states.\n\nssd only ever reaches a disk on the scsi bus: the pre-existing\nvirtio-blk bus filter drops it from the VM root disk unconditionally,\nregardless of how the value resolved (explicit or auto). Unlike\ndiscard, ssd IS governed by disk_perf_invariant_mode on re-attach — a\ndisk whose creation-time record diverges from a later resolution\n(e.g. a legacy disk created before auto-resolution existed, now\nauto-resolving ssd=1 on a TRIM-capable pool) is caught by that guard\nexactly as any other structural option divergence is.\n",
