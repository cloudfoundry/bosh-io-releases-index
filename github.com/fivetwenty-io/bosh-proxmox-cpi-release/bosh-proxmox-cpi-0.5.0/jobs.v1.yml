      {
        "Name": "pve.placement.memory_signal",
        "Description": "Selects which live memory signal the placement scorer's Mem axis uses\nto rank candidate nodes: \"reserved\" (default) sums each resident QEMU\nguest's configured memory (maxmem) on a node, regardless of run state,\nand scores free capacity as (node total memory − that sum) / node\ntotal memory. This tracks memory reservations rather than actual host\nmemory in use, so a sequence of freshly-booted BOSH VMs — which touch\nonly a fraction of their reserved RAM — still visibly lowers a node's\nscore on every create, causing sequential creates to fan out across\nequal nodes instead of stacking on whichever node's resident-memory\nusage happens to lag behind. \"resident\" restores the legacy signal:\nfree memory = node total memory − memory currently resident in the\nhost (Maxmem − Mem from PVE cluster status). Any other value, or a\ntypo, falls back to \"reserved\" rather than blocking the deploy.\n",
        "Default": "reserved",
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.placement.weights.guest_count",
        "Description": "Weight applied to the inverse-guest-count axis in the node scorer.\nHigher value = stronger preference for nodes hosting fewer guests\n(spreads load across the cluster). Must be \u003e= 0. When unset (0),\ndefaults to 0.3 at runtime.\n",
        "Default": 0,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.external_command.methods",
        "Description": "CPI methods that trigger the command. Empty (default) runs it on create_vm\nand delete_vm.\n",
        "Default": [],
        "Example": null,
        "Examples": null
