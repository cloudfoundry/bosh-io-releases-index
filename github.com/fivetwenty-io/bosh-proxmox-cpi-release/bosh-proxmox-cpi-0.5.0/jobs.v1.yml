      {
        "Name": "pve.vm_firewall",
        "Description": "When true, every NIC of newly created VMs is given PVE's per-NIC firewall\nflag (firewall=1). A per-NIC network cloud_property (firewall: true|false)\noverrides this global default for that NIC. Note: enabling the NIC flag\nalone does not activate packet filtering — PVE also requires the VM-level\nfirewall to be enabled. The security_groups VM cloud_property enables both\nthe group rules and the VM-level firewall. Default false (no behavior\nchange). PVE also requires the cluster-wide datacenter firewall master\nswitch (Datacenter \u003e Firewall \u003e Options \u003e Enable) to be on before any of\nthis is actually enforced; create_vm probes that switch once per process\nwhenever this flag (or security_groups, or allowed_address_pairs) is in\nplay and warns if it is off. Enabling the master switch activates\ncluster-wide host-level enforcement — see docs/configuration.md for the\nanti-lockout prerequisites before turning it on.\n",
        "Default": false,
