      {
        "Name": "pve.stemcell_template_pool",
        "Description": "PVE resource pool name assigned to newly created template VMs. The CPI\ncreates this pool if it does not already exist, tagging it with a\n\"managed by bosh-proxmox-cpi\" provenance comment, before the first\ntemplate VM is assigned to it. Default \"bosh-templates\"\n(create-if-missing); set explicitly to \"\" to opt out entirely — no\npool assignment and no pool creation.\n\nMust not equal pve.vm_pool (validated at config load): pools are the\nCPI's ACL boundary, and sharing one pool would let a create_vm-scoped\nACL also touch stemcell templates. Must not start with \"bosh-lock-\"\n(reserved for the cluster-lock sentinel pool namespace, see\npve.cluster_lock_mode) and must be a flat PVE poolid (no \"/\"); the CPI\nnever creates nested pools.\n",
