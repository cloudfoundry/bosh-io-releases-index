      {
        "Name": "pve.disk_delete_state_guard",
        "Description": "Whether delete_disk first checks the lock state of the VM the target disk\nis attached to before deleting it. One of \"off\" or \"on\" (the default). When \"on\" (default), delete_disk scans the cluster for the VM\nwhose config currently references the volume (the VMID baked into the\nvolume name is only an allocation placeholder, so the attached VM is\nresolved by config, not by name) and, if that VM holds a destructive or\nin-flight config lock (backup, clone, migrate, snapshot, rollback, or\ncreate), defers the delete with a retriable error so the BOSH Director\nre-drives it once the operation completes — closing the window in which an\nimgdel could otherwise race a nightly vzdump/PBS backup, a clone, or a\nmigration of the same disk. The guard is best-effort: a disk attached to\nno VM (the normal pre-delete state) is allowed straight through, and any\nattachment-resolution uncertainty fails open so a guard hiccup never\nblocks a legitimate delete — the worst case of leaving this on its\ndefault is a delayed delete during a backup window, never a hard\nfailure. Set \"off\" to restore the earlier unguarded behaviour (no attachment\nlookup, byte-identical to releases before this default changed).\nOperator note: if the attached VM is left with a stuck config lock,\ndelete_disk will keep deferring; clear it with \"qm unlock \u003cvmid\u003e\" on\nthat VM's node.\n",
        "Default": "",
        "Example": null,
