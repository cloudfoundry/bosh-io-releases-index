      {
        "Name": "pve.sdn_zone_type",
        "Description": "PVE zone type the CPI uses when it creates a zone (requires\nsdn_auto_manage_zone). One of: simple, vlan, qinq, vxlan, evpn.\nThe default \"vxlan\" builds a cluster-wide L2 overlay — peers are\nauto-derived from the online cluster nodes (override with\npve.sdn_vxlan_peers) and each vnet gets a VNI from the\nsdn_vni_range band. \"vlan\" maps each managed network onto an 802.1Q\nVLAN of the physical fabric: the zone is created with\npve.network_bridge as its underlay (the bridge must exist on every\nnode, VLAN-aware, with trunked switch ports), each vnet carries the\nVLAN ID as its tag (cloud_properties.vnet_tag, capped at 4094), and\nVMs join by bridge selection alone — no VLAN tag ever appears in a\nVM's NIC config. \"simple\" remains an opt-in for single-node or\ndeliberately node-local networks (its bridges do not span nodes).\n\"qinq\" zones must pre-exist (the CPI does not auto-create them).\n\"evpn\" is never CPI-created: pre-create the zone and its BGP\ncontroller in PVE, and the CPI manages only vnets and subnets\ninside it.\n",
        "Default": "vxlan",
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.disk_vmid_range_end",
        "Description": "Inclusive upper bound of the VMID range for persistent-disk containers.\nWhen unset (0), defaults to 29999. Must be \u003e disk_vmid_range_start.\n",
        "Default": 0,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.vm_pool",
        "Description": "PVE resource pool name assigned to every VM create_vm provisions, on\nboth the import path and the clone path (both PVE's create and clone\nendpoints accept \"pool\" directly). The CPI creates the resolved pool\nif it does not already exist, tagging it with a \"managed by\nbosh-proxmox-cpi\" provenance comment, before the first VM lands in it.\nDefault \"bosh\" (create-if-missing); set explicitly to \"\" to opt this\nglobal layer out entirely — a higher-precedence layer still\napplies if set, and when every layer resolves empty no pool is\nassigned, byte-identical to every release before this property\nexisted.\n\nResolution precedence (highest wins, first non-empty selected):\ncall-level cloud_properties.pool \u003e vm_type profile cloud_properties.pool\n\u003e pve.vm_pool_template (rendered) \u003e this global value. See\npve.vm_pool_template below for the template layer's four supported\nvariables.\n\nSetting this lets an operator scope the CPI's VM.* ACL grants to\n/pool/\u003cname\u003e instead of cluster-wide /vms, shrinking the blast radius\nof a compromised CPI token on a shared cluster: PVE's create and clone\nendpoints accept \"VM.Allocate on /vms/{vmid}\" OR \"VM.Allocate on\n/pool/{pool}\" when a pool is supplied, and existing-VM operations\n(config, power, disk, etc.) resolve permissions on /vms/{vmid}\ninclusive of any ACL granted on a pool the VM belongs to (PVE's\nresource-pool permission propagation) — so a token granted only on\n/pool/\u003cname\u003e can fully manage every VM this CPI creates once vm_pool\nis set. See docs/pve-api-permissions.md for the reduced ACL table and\none gap the pool scoping does not close (cloning still requires\nVM.Clone on the *template's* own vmid/pool, which is not automatically\ncovered).\n\nMust not equal stemcell_template_pool, and must not start with\n\"bosh-lock-\" (reserved for the cluster-lock sentinel pool namespace,\nsee pve.cluster_lock_mode) — both are rejected at config load. Must be\na flat PVE poolid (no \"/\"); the CPI never creates nested pools.\n",
        "Default": "bosh",
        "Example": null,
        "Examples": null
      },
      {
