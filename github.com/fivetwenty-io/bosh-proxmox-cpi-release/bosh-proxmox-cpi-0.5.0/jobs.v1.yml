      {
        "Name": "pve.ensure_no_ip_conflicts",
        "Description": "When true (default), create_vm scans the whole cluster's VMs and checks\nthat none already holds the requested static IP before provisioning.\nPrevents duplicate-IP collisions on static networks. Set to false only for\ndynamic (DHCP) networks where IP pre-assignment is not meaningful.\nProtective default: true. Omitting this property preserves the default.\n",
        "Default": true,
        "Example": null,
