      {
        "Name": "pve.root_disk_bus",
        "Description": "Selects the PVE bus the root (system) disk is created on. \"virtio\"\n(default when empty): root disk lands on virtio0 — byte-identical to\nevery release before this property existed. \"scsi\": root disk lands on\nscsi0, under the same virtio-scsi controller persistent disks already\nuse, which unlocks TRIM (discard) and ssd auto-resolution on the root\ndisk itself (disk_performance.discard/.ssd auto-resolution is otherwise\nunavailable on virtio-blk).\n\nPersistent-disk slot allocation is unaffected either way: scsi0 has\nalways been reserved for the root disk and attach_disk has always\nstarted its free-slot search at scsi1, so there is no slot collision to\nmanage when the root disk moves onto the scsi bus.\n\nClone-path requirement: create_vm's dominant path clones a pre-built\nstemcell template (every \"template:\u003cvmid\u003e\" stemcell CID), and a clone\ninherits its source template's exact disk layout. Templates are built\nonce by create_stemcell and reused by content-hash tag match, so\nflipping this setting does not retroactively rebuild existing\ntemplates. create_vm compares the resolved bus against the matched\ntemplate's actual root disk key before cloning and fails with a clear,\nnon-retriable error naming the conflict on a mismatch, rather than\nsilently producing a root disk on the wrong bus. After changing this\nvalue, re-run create_stemcell for affected stemcells so new templates\nare built on the matching bus.\n\nOne of virtio|scsi.\n",
