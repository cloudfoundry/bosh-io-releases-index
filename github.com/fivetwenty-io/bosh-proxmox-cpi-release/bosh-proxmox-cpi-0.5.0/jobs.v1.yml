      {
        "Name": "pve.otel.logs.enabled",
        "Description": "When true, the CPI exports its structured stderr logs as OpenTelemetry\nlog records via OTLP to pve.otel.logs.exporter_endpoint (or, if that is\nempty, pve.otel.exporter_endpoint). Independent of pve.otel.enabled:\nlogs can be exported with tracing off. Default false; when false no\nlog exporter is built, no network connection is opened for logs, and\nexport failures never fail a CPI call (fail-open).\n",
