      {
        "Name": "pve.vm_prefix",
        "Description": "Optional prefix prepended to every CPI-provisioned VM's PVE name.\nWhen set (e.g. \"cpi\") VM names take the form\n\"\u003cprefix\u003e-\u003cdeployment\u003e-\u003cjob\u003e-\u003cindex\u003e\", so deployments sharing a PVE\ncluster can be filtered by prefix in the PVE UI. When empty the\nprefix is omitted and the name is \"\u003cdeployment\u003e-\u003cjob\u003e-\u003cindex\u003e\".\n",
