      },
      {
        "Name": "pve.stemcell_replicate_local",
        "Description": "When true, create_stemcell builds a per-node cache template (tagged\n\"bosh-stemcell-node-\u003cnode\u003e\") on every candidate cluster node, enabling\ncreate_vm on nodes that cannot reach a cross-node clone source.\n\nThe gate is pve.vm_storage — where every cache template's root disk\nlands — not the stemcell (qcow2) pool. Replicas are built whenever\nvm_storage classifies as node-local, regardless of whether the qcow2\npool is shared; a shared qcow2 pool only skips the per-node file copy,\nnot the per-node template. This applies to every stemcell kind,\nincluding a pre-uploaded \":light:\" image the operator owns.\n\ndelete_stemcell removes all replicas (best-effort; a single-node failure\nis logged and skipped rather than aborting).\n\nDefault false: a node-local vm_storage on a multi-node cluster is then\nrejected at create_stemcell time with a clear error directing the\noperator to use shared storage or enable this flag. Not needed when\nvm_storage is shared (e.g. Ceph RBD): a single cache template then\nserves every node via cross-node clone, even when the qcow2 staging\npool (stemcell_storage) is node-local.\n",
        "Default": false,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.storage_tiers",
        "Description": "Optional map of operator-named storage tiers. Each key is a tier label\n(e.g. \"fast\", \"bulk\") and each value is an object with up to two fields:\ntypes (list of PVE storage types such as lvm, lvmthin, zfspool, dir, nfs,\ncifs, rbd, cephfs, btrfs, glusterfs, pbs) and shared (bool). At create_vm\nor create_disk time the CPI selects the first live cluster storage whose\ntype and shared flag match the criteria. A tier is selected by setting\ncloud_properties.storage_tier to the tier name. When unset (default {}),\nno tier matching runs and storage is chosen by the existing vm_storage /\ndisk_storage config fields.\n",
        "Default": {},
        "Example": null,
        "Examples": null
