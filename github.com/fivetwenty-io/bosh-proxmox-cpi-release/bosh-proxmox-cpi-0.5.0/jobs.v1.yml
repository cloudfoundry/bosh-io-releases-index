        "Name": "pve.placement.anti_affinity.strict",
        "Description": "When true, the PVE HA negative resource-affinity rule created by\nanti_affinity.use_ha_rules is set to strict mode (hard spread): PVE\nrefuses to place or failover a VM onto a node that already hosts another\nmember of the same instance group. Strict mode can block HA failover on\nsmall clusters when no compliant node exists. Default false (advisory\nspreading — PVE honors the rule as a soft preference, not an absolute\nconstraint). Has no effect unless anti_affinity.use_ha_rules is true.\n",
