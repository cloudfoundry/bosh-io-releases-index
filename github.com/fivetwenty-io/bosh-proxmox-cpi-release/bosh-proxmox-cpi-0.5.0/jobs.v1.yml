      {
        "Name": "pve.placement.fallback_max",
        "Description": "Maximum number of alternate candidate nodes to try after a transient clone or\nVM start failure on the initially selected node. When 0 (default), create_vm\nmakes a single attempt on the selected node and returns any failure immediately\n— behavior is unchanged from prior releases. When \u003e 0, on a transient failure\n(classified by the same transient/permanent classifier used for intra-attempt\nretries) the CPI cleans up the partial VM (purges it, freeing the VMID) and\nretries on the next-ranked candidate from the same constrained placement set\n(same AZ restriction and disk fault-domain co-location constraints). Permanent\nerrors (missing clone source, non-retriable PVE errors) fail immediately\nwithout consuming alternates. Valid range: 0 (off) to 5. Recommended\noperational value: 2.\n",
        "Default": 0,
        "Example": null,
