      {
        "Name": "pve.disk_performance.discard",
        "Description": "Tri-state (true|false|unset, default unset = auto). Controls discard=on\n(TRIM/UNMAP passthrough to the underlying storage) on every disk created\nby this CPI. Overridden per disk by cloud_properties.discard, which\naccepts the same three states.\n\nunset (auto, the default) — discard is resolved per disk at bake time\n(create_disk/create_vm/attach_disk) based on the disk's actual resolved\nstorage pool: \"on\" when the pool is TRIM-capable — lvmthin, zfspool,\nrbd (any format), or a file-backed pool (dir/nfs/cifs) with a qcow2\ndisk image — and omitted otherwise (thick lvm, cephfs, glusterfs, or\nany other backend where TRIM does not reclaim space). This matters\nbecause guest-deleted blocks are never reclaimed without discard on a\nthin pool, so an unmanaged thin pool grows monotonically until full.\ntrue  — forces discard=on regardless of the resolved pool's TRIM\n        capability; PVE is left to accept or reject the value.\nfalse — always omits the key, restoring the pre-auto behavior (PVE\n        uses its own default) on every disk, TRIM-capable or not.\n\nAn explicit true/false at any layer (cloud_properties, disk_type/\nvm_type profile, or this global default) always wins over auto\nresolution. The resolved value is baked at create/attach time only;\nconfig changes never rewrite existing disks or VMs on their own, and a\ndisk whose recorded creation-time value diverges from a later\nre-resolution follows the normal cloud_properties/pve_config\nprecedence — discard itself is not governed by\ndisk_perf_invariant_mode (see that property; it never was, even before\nauto-resolution — discard can change on a live device without a\nstructural reconfiguration). An operator update through update_disk is\nrecorded per disk and wins over both layers at every later attach.\n",
        "Default": null,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.sdn_vni_range_end",
        "Description": "End of the tag auto-allocation band. 0 uses the default band\n(5000-5999, or 2000-2999 for vlan/qinq zone types).\n",
        "Default": 0,
