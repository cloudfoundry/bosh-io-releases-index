      {
        "Name": "pve.allow_disk_ops_with_snapshots",
        "Description": "When true, bypasses the snapshot pre-flight guard in attach_disk, detach_disk,\nand resize_disk. Use only for emergency disk recovery; snapshot state will be\ninconsistent after the operation. Default false (guard active).\n",
