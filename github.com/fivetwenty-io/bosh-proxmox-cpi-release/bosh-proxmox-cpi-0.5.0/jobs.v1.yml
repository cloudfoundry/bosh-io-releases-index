      {
        "Name": "pve.storage.max_utilization_mode",
        "Description": "Enforcement mode when placement.storage.max_utilization_pct is exceeded.\nOnly consulted when max_utilization_pct is \u003e 0. One of \"enforce\"\n(default) or \"warn\":\n  - enforce: create_vm placement rejects the candidate node; create_disk\n    and resize_disk return a RETRIABLE cloud error naming the pool, the\n    current projected percentage, and the ceiling — capacity can be\n    freed, so the director should re-drive rather than treat this as a\n    permanent, non-retriable failure.\n  - warn: the same facts are logged at Warn and the operation proceeds\n    unblocked.\nsnapshot_disk ignores this setting: it is always Warn-only regardless of\nmax_utilization_mode, since snapshot growth cannot be estimated and\nblocking snapshots on a capacity guess would be unsound.\n",
