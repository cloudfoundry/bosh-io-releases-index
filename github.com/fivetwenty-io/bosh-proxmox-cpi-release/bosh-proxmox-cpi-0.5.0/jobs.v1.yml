      {
        "Name": "pve.network_resolve_retries",
        "Description": "Eventual-consistency poll budget for freshly created SDN networks. SDN\nstate propagates over inter-node SSH, so one broken node can leave a\nnewly applied SDN vnet silently pending cluster-wide while the apply\ntask still reports success — the data-plane realization (ifupdown2\nreload, pmxcfs propagation) is asynchronous and per-node, so a create_vm\nthat immediately follows a create_network on a different node can\nattach a NIC to a bridge that does not yet exist there. When \u003e 0 (the\ndefault: 30, roughly 30 seconds at the 1-second poll\ncadence), create_network polls the running cluster SDN config until the\nnew vnet converges, and create_vm confirms each SDN-managed NIC bridge\nis present on the target node before writing the NIC config — a\nnot-yet-present bridge is treated as a retriable error so the BOSH\nDirector re-drives rather than booting a NIC into a bridge that does\nnot exist, converting the silent race into an actionable, retriable\nfailure. Only SDN-managed vnets are gated; external or static Linux\nbridges (e.g. vmbr0) always pass straight through untouched, and SDN-\nmembership lookup failures fail the gate open (never block a legitimate\ndeploy on the guard's own lookup blip) — so the worst case of the\ndefault is a bounded retriable delay, never a false block. Both polls\nare bounded by network_resolve_timeout_sec. Set explicitly to 0 to\ndisable both gates and restore the earlier ungated behavior (create_network\nand create_vm byte-identical to releases before this default changed).\nSet to any other positive value to override the retry budget. This\nproperty has no default in this spec (see the CPI's own accessor for\nwhy: an unset property must be distinguishable from an explicit 0 to\nsupport the disable case) — omitting it from the manifest is exactly\nequivalent to leaving it unset, which resolves to 30.\n",
        "Default": null,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.node_endpoints_discovery",
        "Description": "Explicit override for whether uploadISO to a node absent from\npve.node_endpoints falls back to /cluster/status name-to-IP discovery.\nUnset (the default) preserves the pre-existing behavior byte-for-byte:\ndiscovery runs exactly when verify_ssl is false. Set false to opt a\nverify_ssl:false deployment out of discovery entirely, for example a\ncluster running corosync on a dedicated ring, where the discovered\naddress is not where pveproxy listens, so every discovered dial fails\nand falls back to the proxied path with a warning until the operator\nmaps the affected nodes explicitly; false skips straight to the\nproxied path instead. Set true to force discovery on even with\nverify_ssl true (the operator accepts that the discovered corosync IP\nis unlikely to be covered by the node certificate; a mismatched dial\nstill falls back to the proxied path rather than failing the deploy).\nExplicit pve.node_endpoints entries are unaffected either way; they\nstay opt-in by construction and need no gate.\n",
