      {
        "Name": "pve.placement.dlb.enabled",
        "Description": "Master switch for PVE 9.2+ Dynamic Load Balancer (CRS dynamic mode)\nintegration. When true, every VM created by this CPI is registered as a\nPVE HA resource with auto-rebalance=1 and state=started, delegating\ninitial placement and continuous rebalancing to the DLB. Works alongside\noperator-defined availability zones: master-flag-on VMs are still scored\nwithin their AZ candidate set at create time; DLB then rebalances within\nallowed nodes afterward. Default false (opt-in). See also\nplacement.dlb.az_name for per-workload sentinel-AZ opt-in.\n",
        "Default": false,
        "Example": null,
        "Examples": null
      },
      {
        "Name": "pve.disk_perf_invariant_mode",
        "Description": "Controls enforcement of creation-time disk-performance invariants at\nattach_disk time. The structural options cache, iothread, and ssd are\nbaked into the disk CID at create_disk time; on re-attach the CPI merges\nglobal disk_performance defaults over the recorded options. If global\nconfig has since introduced a structural option the disk did not have at\ncreation, the disk's runtime profile would silently diverge from its\nrecorded one. This knob governs that case:\n  enforce (default) - reject the attach with a non-retriable error\n  warn              - log the divergence and proceed with the merged options\n  off               - skip the check entirely\nThrottle options (mbps_*, iops_*) and discard are never enforced. The\ncheck is a no-op for any disk whose CID carries no performance options, so\nbehavior is unchanged unless disk_performance options were recorded.\nOptions an operator updates through update_disk are recorded per disk\nand join the expected baseline, so an intentional update never reads as\na divergence; only drift the disk never opted into trips the guard.\nValid values: \"\" (empty, same as \"enforce\"), \"enforce\", \"warn\", \"off\".\n",
        "Default": "",
        "Example": null,
        "Examples": null
      },
