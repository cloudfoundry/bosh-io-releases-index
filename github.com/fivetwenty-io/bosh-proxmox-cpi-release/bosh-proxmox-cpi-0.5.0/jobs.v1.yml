        "Description": "How create_vm materializes a VM root disk from a stemcell CID.\n\"template\" — clone the per-cluster stemcell cache template (CoW-fast;\n         the cache is built eagerly by create_stemcell and used by\n         every create_vm on the cluster).\n\"import\" — import the stemcell qcow2 directly into the VM root disk\n         (full copy per VM; slower, but independent of the template\n         cache — useful when clones must not share a base volume).\nPer-VM override: vm_type/resource_pool cloud_properties.stemcell_strategy.\n",
