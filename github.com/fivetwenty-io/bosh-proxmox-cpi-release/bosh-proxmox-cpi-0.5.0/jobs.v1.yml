        "Description": "When true, the CPI appends one JSON-line sample per RPC to the file at\npve.metrics.file_path. Each line carries: ts (RFC3339Nano), method,\nduration_ms, outcome (ok|error), and request_id. duration_ms covers\nhandler execution; post-call work by other configured hooks is not\nincluded. Write failures are\nlogged at Warn level and never fail the CPI call. Default false; the\nhook is not registered when false and adds zero dispatch-path overhead.\n",
        "Default": false,
        "Example": null,
        "Examples": null
      },
      {
